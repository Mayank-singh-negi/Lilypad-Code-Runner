[project]
name = "lilypad-code-runner"
version = "1.0.0"
description = "Lilypad Code Runner - Visual Programming Environment"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.1.3"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api"]

[tool.setuptools.package-data]
api = ["../templates/*", "../static/*"]
